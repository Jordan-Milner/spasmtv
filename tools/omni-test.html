<!doctype html><meta charset="utf-8"><title>omni-test</title>
<script type="module">
import { loadOmni, loadOmniAudio, omniTranscribe, omniGenerate } from '/workers/omni.js';
const r = { stage: 'start' };
window.__result = r;
try {
  const t0 = performance.now();
  await loadOmni(); r.loadMs = Math.round(performance.now() - t0); r.stage = 'loaded';
  const t1 = performance.now();
  r.text = await omniGenerate({ prompt: 'Write one short Twitch chat message reacting to a streamer saying hello.', maxNewTokens: 16, temperature: 0.7, topK: 40 });
  r.textMs = Math.round(performance.now() - t1);
  const t2 = performance.now();
  await loadOmniAudio(); r.audioLoadMs = Math.round(performance.now() - t2); r.stage = 'audio-loaded';
  const buf = await (await fetch('/videos/speech-test.f32')).arrayBuffer();
  const pcm = new Float32Array(buf);
  const t3 = performance.now();
  r.transcript = await omniTranscribe(pcm); r.asrMs = Math.round(performance.now() - t3);
  const t4 = performance.now();
  r.silence = await omniTranscribe(new Float32Array(16000 * 3)); r.silenceMs = Math.round(performance.now() - t4);
  r.stage = 'done';
} catch (e) { r.error = String(e?.stack || e).slice(0, 600); r.stage = 'error'; }
</script>
